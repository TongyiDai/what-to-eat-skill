<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">推荐要有变化，也要记得边界</text><text x="88" y="98" fill="#666666" font-size="16">少重复菜品、菜系和主食形态</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><line x1="180" y1="360" x2="1020" y2="360" stroke="#222222" stroke-width="1"/><rect x="130" y="300" width="170" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="340" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">菜品</text><text x="215" y="362" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">黄焖鸡</text><rect x="130" y="400" width="170" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="440" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">菜系</text><text x="215" y="462" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">连续中餐</text><rect x="350" y="300" width="170" height="70" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="435" y="340" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">主食形态</text><text x="435" y="362" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">连续面食</text><path d="M520 335 C600 290 670 290 740 350" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><circle cx="800" cy="360" r="52" fill="white" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="800" cy="360" r="6" fill="#2F6BFF"/><text x="800" y="354" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">换一批</text><text x="800" y="380" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">保留变化</text><path d="M855 360 C910 320 950 320 1010 360" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><rect x="1010" y="320" width="100" height="80" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="1060" y="355" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">Top 3</text><text x="1060" y="380" text-anchor="middle" fill="#2F6BFF" font-size="12" font-weight="400">具体菜品</text><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">记住过去，才能推荐下一批</text></g></svg>
