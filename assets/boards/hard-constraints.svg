<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">先满足硬约束，再给三道菜</text><text x="88" y="98" fill="#666666" font-size="16">忌口和过敏先过滤，口味和饭点再排序</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><rect x="110" y="280" width="180" height="68" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="200" y="320" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">忌口和过敏</text><rect x="110" y="400" width="180" height="68" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="200" y="440" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">当前饭点</text><path d="M290 314 C370 270 430 270 500 340" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M290 434 C370 478 430 478 500 380" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><circle cx="560" cy="360" r="52" fill="white" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="560" cy="360" r="6" fill="#2F6BFF"/><text x="560" y="354" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">先过滤</text><text x="560" y="380" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">硬约束</text><path d="M615 360 C700 300 770 300 840 345" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><rect x="840" y="255" width="210" height="58" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="945" y="291" text-anchor="middle" fill="#111111" font-size="18" font-weight="600">第一道菜</text><rect x="840" y="335" width="210" height="58" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="945" y="371" text-anchor="middle" fill="#111111" font-size="18" font-weight="600">第二道菜</text><rect x="840" y="415" width="210" height="58" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="945" y="451" text-anchor="middle" fill="#111111" font-size="18" font-weight="600">第三道菜</text><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">先排除不能吃的，再给可选答案</text></g></svg>
